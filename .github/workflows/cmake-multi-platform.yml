# Builds the framework on Linux (GCC, Clang), Windows (MSYS2 UCRT64, MSVC) and macOS.
# Legs marked "experimental" report their result without failing the workflow.
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes a run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental == true }}

    defaults:
      run:
        # MSYS2 legs run every step inside the UCRT64 environment; all others use bash.
        shell: ${{ matrix.msys2 && 'msys2 {0}' || 'bash' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Preset legs use CMakePresets.json (Ninja, Release).
          - name: Linux / GCC
            id: linux-gcc
            os: ubuntu-latest
            preset: release
            artifact_path: build/release/bin
            smoke: true

          - name: Linux / Clang
            id: linux-clang
            os: ubuntu-latest
            preset: clang-release
            artifact_path: build/clang-release/bin

          - name: Windows / MSYS2 UCRT64 (GCC)
            id: windows-msys2
            os: windows-latest
            msys2: true
            preset: release
            artifact_path: build/release/bin

          # Generic legs use the platform's default generator.
          - name: Windows / MSVC (experimental)
            id: windows-msvc
            os: windows-latest
            experimental: true
            artifact_path: build/bin

          - name: macOS / AppleClang (experimental)
            id: macos
            os: macos-latest
            experimental: true
            artifact_path: build/bin

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev wayland-protocols \
            xorg-dev libgl1-mesa-dev xvfb libgl1-mesa-dri

      - name: Install Clang
        if: runner.os == 'Linux' && startsWith(matrix.preset, 'clang')
        run: sudo apt-get install -y --no-install-recommends clang

      - name: Set up MSYS2 (UCRT64)
        if: matrix.msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-git

      - name: Configure (preset)
        if: matrix.preset
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (preset)
        if: matrix.preset
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Configure
        if: ${{ !matrix.preset }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: ${{ !matrix.preset }}
        run: cmake --build build --config Release --parallel

      # Starts the app under a virtual display with software rendering. The app never exits on its
      # own, so exit code 124 (killed by timeout) means it initialised and rendered frames.
      - name: Smoke test (headless)
        if: matrix.smoke
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set +e
          timeout 5 xvfb-run -a "${{ matrix.artifact_path }}/hello"
          status=$?
          echo "exit status: $status"
          [ "$status" -eq 124 ]

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: imgui-hello-${{ matrix.id }}
          path: ${{ matrix.artifact_path }}
          retention-days: 7
          if-no-files-found: warn
