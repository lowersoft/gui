[theme]
name = Midnight
base = dark                  ; dark | light

[palette]
bg      = #1a3048
surface = #d50000
accent  = #ff9100
text    = #E6E6EB

[colors]                     ; keys = ImGuiCol_
Text          = $text
TextDisabled  = $text @0.5   ; @ = alfa
WindowBg      = $bg
ChildBg       = #00000000    ; #RRGGBB or #RRGGBBAA
FrameBg       = $surface
Button        = $accent @0.60
ButtonHovered = $accent @0.80
ButtonActive  = $accent
TabSelected   = $accent

[style]                      ; optional: sizes
WindowRounding = 6
FrameRounding  = 4
FramePadding   = 8, 4