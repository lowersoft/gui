
; ---------------------------------------------------------------------------
; Dear ImGui theme
;
; [theme]    name, base (dark | light | classic), author, description
; [palette]  name = #RRGGBB or #RRGGBBAA; referenced below as $name
; [colors]   One entry per ImGuiCol_ name (Text, WindowBg, Button, ...).
;            Value: #RRGGBB | #RRGGBBAA | $palette_name, optionally followed by
;            "@alpha" (0..1) which multiplies the alpha of the color.
; [style]    ImGuiStyle metrics in logical pixels (scaled by display DPI).
;            Numbers, or "x, y" for two-component fields.
;
; Keys are case-insensitive. Anything omitted keeps the value of the base theme.
; The file is hot-reloaded while the application runs.
; ---------------------------------------------------------------------------

[theme]
name = 
base = dark
author = Framework defaults
description = Dark blue theme driven by a small palette

[palette]
bg         = #060606
surface    = #141414
surface_hi = #1C1C1C
border     = #2E2E2E
text       = #E0E0E0
text_dim   = #a0a0a0
accent     = #262626
accent_hi  = #303030
accent_lo  = #222222

[colors]
Text                      = $text
TextDisabled              = $text_dim
WindowBg                  = $bg
ChildBg                   = #00000000
PopupBg                   = $surface
Border                    = $border
BorderShadow              = #00000000
FrameBg                   = $surface_hi
FrameBgHovered            = $border
FrameBgActive             = $accent_lo
TitleBg                   = $surface
TitleBgActive             = $surface_hi
TitleBgCollapsed          = $surface @0.75
MenuBarBg                 = $surface
ScrollbarBg               = $bg @0.5
ScrollbarGrab             = $border
ScrollbarGrabHovered      = $text_dim
ScrollbarGrabActive       = $accent
CheckMark                 = $accent_hi
CheckboxSelectedBg        = $accent_lo
SliderGrab                = $accent
SliderGrabActive          = $accent_hi
Button                    = $accent_lo
ButtonHovered             = $accent
ButtonActive              = $accent_hi
Header                    = $accent_lo @0.6
HeaderHovered             = $accent @0.8
HeaderActive              = $accent
Separator                 = $border
SeparatorHovered          = $accent
SeparatorActive           = $accent_hi
ResizeGrip                = $accent @0.25
ResizeGripHovered         = $accent @0.67
ResizeGripActive          = $accent @0.95
InputTextCursor           = $text
TabHovered                = $accent
Tab                       = $surface
TabSelected               = $accent_lo
TabSelectedOverline       = $accent_hi
TabDimmed                 = $surface
TabDimmedSelected         = $surface_hi
TabDimmedSelectedOverline = $accent @0.5
DockingPreview            = $accent @0.7
DockingEmptyBg            = $bg
PlotLines                 = $text_dim
PlotLinesHovered          = $accent_hi
PlotHistogram             = $accent
PlotHistogramHovered      = $accent_hi
TableHeaderBg             = $surface_hi
TableBorderStrong         = $border
TableBorderLight          = $border @0.6
TableRowBg                = #00000000
TableRowBgAlt             = $text @0.04
TextLink                  = $accent_hi
TextSelectedBg            = $accent @0.35
TreeLines                 = $border
DragDropTarget            = $accent_hi
DragDropTargetBg          = $accent @0.2
UnsavedMarker             = $accent_hi
NavCursor                 = $accent_hi
NavWindowingHighlight     = $text @0.7
NavWindowingDimBg         = $bg @0.6
ModalWindowDimBg          = $bg @0.6

[style]
WindowPadding     = 10, 10
FramePadding      = 8, 5
ItemSpacing       = 8, 6
ItemInnerSpacing  = 6, 4
WindowBorderSize  = 1
FrameBorderSize   = 0
WindowRounding    = 0
ChildRounding     = 0
PopupRounding     = 0
FrameRounding     = 0
ScrollbarRounding = 8
GrabRounding      = 0
TabRounding       = 0
ScrollbarSize     = 14
